name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Validate HTML
        run: npx --yes htmlhint@1.9.2 index.html

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Validate CSS
        run: |
          printf '%s\n' '{"rules":{"block-no-empty":true,"color-no-invalid-hex":true,"declaration-block-no-duplicate-properties":true,"property-no-unknown":true}}' > "$RUNNER_TEMP/stylelint.json"
          npx --yes stylelint@18.0.0 style.css --config "$RUNNER_TEMP/stylelint.json"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html style.css script.js _site/
          cp -r img _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
